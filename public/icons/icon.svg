  <line x1="256" y1="324" x2="256" y2="384" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
  <line x1="206" y1="384" x2="306" y2="384" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />

